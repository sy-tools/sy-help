name: Deploy Pages

# The site is site/ plus what tools.publish lays out: catalog.json, subs/, and
# every video the catalog lists, decoded from its scrambled asset in the
# `media` release to v/<file>.mp4. Videos never enter git, and the release
# holds only .bin files a player cannot open.
#
# A push by GITHUB_TOKEN fires no workflow, so ingest.yml and subtitles.yml
# dispatch this one after they commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Lay out the site from the catalog and the media release
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/assets
          gh release download media --repo "$GITHUB_REPOSITORY" --dir /tmp/assets
          python -m tools.publish --catalog catalog.json --assets /tmp/assets --subs subs --out site
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -yq ffmpeg
          fi
          python -m tools.share_pages --site site --help-base "$PAGES_BASE_URL"
          # GitHub Pages refuses a published site over 1 GB.
          size_mib=$(du -sm site | cut -f1)
          echo "site: ${size_mib} MiB"
          if [ "$size_mib" -ge 1000 ]; then
            echo "::error::site is ${size_mib} MiB; GitHub Pages caps a site at 1 GB"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
